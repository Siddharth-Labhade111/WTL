<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Task</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="page narrow">
    <div class="section-heading">
        <div>
            <h1>Assign New Task</h1>
            <p class="subtitle">Fill in the task details</p>
        </div>
        <div class="actions">
            <a class="button secondary" th:href="@{/tasks}">Back to Tasks</a>
        </div>
    </div>

    <section class="form-card">
        <form th:action="@{/tasks}" th:object="${taskItem}" method="post">
            <div class="form-grid">
                <label>
                    Task Title
                    <input type="text" th:field="*{title}" placeholder="Exam duty allocation">
                    <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </label>
                <label>
                    Assign To
                    <select th:field="*{employee}">
                        <option value="">Select employee</option>
                        <option th:each="employee : ${employees}"
                                th:value="${employee.id}"
                                th:text="${employee.name + ' - ' + employee.designation}"></option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('employee')}" th:errors="*{employee}"></span>
                </label>
                <label>
                    Category
                    <select th:field="*{category}">
                        <option value="">Select category</option>
                        <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
                </label>
                <label>
                    Priority
                    <select th:field="*{priority}">
                        <option value="">Select priority</option>
                        <option th:each="priority : ${priorities}" th:value="${priority}" th:text="${priority}"></option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></span>
                </label>
                <label>
                    Due Date
                    <input type="date" th:field="*{dueDate}">
                    <span class="error" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></span>
                </label>
                <label>
                    Initial Status
                    <select th:field="*{status}">
                        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                </label>
                <label class="full-width">
                    Description
                    <textarea rows="4" th:field="*{description}" placeholder="Enter task description"></textarea>
                    <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                </label>
            </div>
            <button class="button" type="submit">Assign Task</button>
        </form>
    </section>
</main>
</body>
</html>
