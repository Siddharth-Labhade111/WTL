<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="page">
    <div class="section-heading">
        <div>
            <h1>Assigned Tasks</h1>
            <p class="subtitle">Task List</p>
        </div>
        <div class="actions">
            <a class="button secondary" th:href="@{/}">Dashboard</a>
            <a class="button" th:href="@{/tasks/new}">Assign Task</a>
        </div>
    </div>

    <section class="table-card">
        <table>
            <thead>
            <tr>
                <th>Title</th>
                <th>Employee</th>
                <th>Category</th>
                <th>Priority</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Update</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}" th:classappend="${task.overdue} ? ' overdue-row' : ''">
                <td>
                    <strong th:text="${task.title}">Task</strong>
                    <p th:text="${task.description}">Description</p>
                </td>
                <td th:text="${task.employee.name}">Employee</td>
                <td th:text="${task.category}">Category</td>
                <td th:text="${task.priority}">Priority</td>
                <td th:text="${task.dueDate}">2026-04-16</td>
                <td><span class="pill" th:text="${task.status}">PENDING</span></td>
                <td>
                    <form th:action="@{/tasks/{id}/status(id=${task.id})}" method="post" class="inline-form">
                        <select name="status">
                            <option th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:text="${status}"
                                    th:selected="${status == task.status}"></option>
                        </select>
                        <button class="button small" type="submit">Save</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${tasks.isEmpty()}">
                <td colspan="7">No tasks assigned yet.</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
